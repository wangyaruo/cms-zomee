# HTTP browsers may omit Origin and Fetch Metadata on safe requests.
# Preserve Origin on writes so Payload still validates its CSRF allowlist.
map "$request_method:$http_origin" $zomeex_cms_origin {
    default $http_origin;
    "GET:" "http://106.74.26.75:8201";
    "HEAD:" "http://106.74.26.75:8201";
}

server {
    listen 8201;
    listen [::]:8201;
    server_name 106.74.26.75;

    # CMS accepts files up to 50 MiB and bounds the complete multipart request to 52 MiB.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:18201;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $zomeex_cms_origin;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
